<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/contact.css">
    <script defer src="/assets/js/script.js"></script>
    <script defer src="/assets/js/contactMap.js"></script>

 
</head>

<body>
    <!-- Loader-ul navbar-ului  -->
    <div id="navbar-container"></div>


<div class="contact-page"></div>

    <div class="titlu-contact">
        <h1>Nu ezita să ne <br>contactezi!</h1>
    </div>

    <div class="pac">
        <svg class="pa" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 814 506">
            <path d="M0 0C363 28 699 184 0 215Z" fill="lightblue"/>
            <text x="30" y="100" font-size="36" fill="black">Treci pe la noi!</text>
            <text x="30" y="130" font-size="20" fill="black">Ne găsești chiar aici: </text>
            <text x="30" y="160" font-size="20" fill="black">Strada Izvor Nr. 10</text>
        </svg>
    </div>




    <div class="container main-container ">
       


        <div class="div-email">
            <img src="/assets/images/email.png" class="img-fluid img-email" alt="">
            <div class="text-email">
                <h2>Email:</h2>
                <p> <a href="mailto:rasnovgenerala2@yahoo.com">rasnovgenerala2@yahoo.com</a></p>
            </div>
        </div>

        <div class="div-telefon">
            <img src="/assets/images/telefon.png" class="img-fluid img-telefon" alt="">
            <div class="text-telefon">
                <h2>Sună-ne!</h2>
                <p>0268 257 399 </p>
            </div>
        </div>

            <!-- Harta -->
        <div class="harta">
            <h2>Localizare</h2>
            <div>
                <input type="checkbox" id="cbTraseu" onclick="initMap()" text="Arata traseu">
                <label for="cbTraseu">Arata traseu</label></div>
                <div id="map"></div>
                
                <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCLCbrD85V1qvECrFB4aguyjes18fVZsbQ" async defer></script>
            </div>

       
    </div>

    <!-- Loader-ul footer-ului-->
    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
   
</body>

</html>
